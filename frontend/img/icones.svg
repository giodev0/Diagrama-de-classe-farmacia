<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    Icones do Sistema de Farmacia, desenhados para esta interface.

    Todos seguem a mesma grade de 24x24, traco de 1.75 com pontas
    arredondadas e cor herdada do texto (currentColor). Uso:

      <svg class="icone" aria-hidden="true"><use href="img/icones.svg#vendas"/></svg>
  -->

  <!-- Capsula: a marca do sistema -->
  <symbol id="marca" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(-45 12 12)">
      <rect x="3" y="8.25" width="18" height="7.5" rx="3.75"/>
      <path d="M12 8.25H6.75a3.75 3.75 0 0 0 0 7.5H12z" fill="currentColor"/>
    </g>
  </symbol>

  <!-- Produtos: frasco de remedio com cruz no rotulo -->
  <symbol id="produtos" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="2.5" width="8" height="3.5" rx="1"/>
    <path d="M7 6h10v13.5a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2z"/>
    <path d="M12 10.5v6M9 13.5h6"/>
  </symbol>

  <!-- Estoque: caixas empilhadas -->
  <symbol id="estoque" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="7.5" y="3" width="9" height="8.5" rx="1"/>
    <rect x="2.5" y="12.5" width="9" height="8.5" rx="1"/>
    <rect x="12.5" y="12.5" width="9" height="8.5" rx="1"/>
    <path d="M12 3v3M7 12.5v3M17 12.5v3"/>
  </symbol>

  <!-- Vendas: sacola de compras -->
  <symbol id="vendas" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 8h15l-1.1 12a1.75 1.75 0 0 1-1.75 1.5H7.35A1.75 1.75 0 0 1 5.6 20z"/>
    <path d="M9 10.5V6.5a3 3 0 0 1 6 0v4"/>
  </symbol>

  <!-- Pagamentos: cartao -->
  <symbol id="pagamentos" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="5" width="19" height="14" rx="2"/>
    <path d="M2.5 9.5h19M6 15h4"/>
  </symbol>

  <!-- Relatorios: grafico de barras -->
  <symbol id="relatorios" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 3.5v17h17"/>
    <rect x="7" y="12" width="3" height="5" rx=".5"/>
    <rect x="12" y="7" width="3" height="10" rx=".5"/>
    <rect x="17" y="10" width="3" height="7" rx=".5"/>
  </symbol>

  <!-- Sair: porta com seta para fora -->
  <symbol id="sair" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13.5 4H6.5A1.5 1.5 0 0 0 5 5.5v13A1.5 1.5 0 0 0 6.5 20h7"/>
    <path d="M10 12h10.5M17 8.5l3.5 3.5-3.5 3.5"/>
  </symbol>

  <!-- Adicionar -->
  <symbol id="mais" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 5v14M5 12h14"/>
  </symbol>

  <!-- Sincronizar: duas setas em circulo -->
  <symbol id="sincronizar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.6 10.7a7.5 7.5 0 0 1 14.8 0"/>
    <path d="M21.9 8.4l-2.5 2.5-2.5-2.5"/>
    <path d="M19.4 13.3a7.5 7.5 0 0 1-14.8 0"/>
    <path d="M2.1 15.6l2.5-2.5 2.5 2.5"/>
  </symbol>

  <!-- Alerta: triangulo com exclamacao -->
  <symbol id="alerta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10.7 4.3a1.5 1.5 0 0 1 2.6 0l8 14A1.5 1.5 0 0 1 20 20.5H4a1.5 1.5 0 0 1-1.3-2.2z"/>
    <path d="M12 9.5v4.5M12 17.2v.1"/>
  </symbol>
</svg>
