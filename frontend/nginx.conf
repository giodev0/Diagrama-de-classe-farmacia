server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Arquivos estaticos do frontend.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cada microsservico fica atras de um caminho /api proprio.
    #
    # Como o navegador so enxerga a origem do nginx, nao existe requisicao
    # entre origens diferentes e o CORS deixa de ser um problema. O frontend
    # tambem nao precisa saber em qual porta cada servico roda.

    location /api/auth {
        proxy_pass http://usuario-service:8001/auth;
        include /etc/nginx/conf.d/proxy-comum.inc;
    }

    location /api/usuarios {
        proxy_pass http://usuario-service:8001/usuarios;
        include /etc/nginx/conf.d/proxy-comum.inc;
    }

    location /api/produtos {
        proxy_pass http://produto-service:8002/produtos;
        include /etc/nginx/conf.d/proxy-comum.inc;
    }

    location /api/estoque {
        proxy_pass http://estoque-service:8003/estoque;
        include /etc/nginx/conf.d/proxy-comum.inc;
    }

    location /api/pagamentos {
        proxy_pass http://pagamento-service:3005/pagamentos;
        include /etc/nginx/conf.d/proxy-comum.inc;
    }

    # ----------------------------------------------------------------------
    # Servicos ainda nao implementados.
    #
    # O frontend ja esta pronto para os dois (js/vendas.js e js/relatorios.js),
    # seguindo o contrato de CONTRATOS.md. Para ligar cada um: apague o bloco
    # "return 503" e descomente o proxy_pass logo acima dele.
    #
    # Os 503 existem porque, sem eles, /api/vendas cairia no try_files e
    # devolveria o index.html com status 200. O frontend receberia HTML no
    # lugar de JSON e mostraria "nenhuma venda" em vez de avisar que o
    # servico nao existe.
    #
    # Nao descomente o proxy_pass antes do servico existir: o nginx resolve o
    # nome do upstream ao iniciar e se recusa a subir se o host nao existir,
    # o que derrubaria o frontend inteiro.
    # ----------------------------------------------------------------------

    # location /api/vendas {
    #     proxy_pass http://venda-service:8004/vendas;
    #     include /etc/nginx/conf.d/proxy-comum.inc;
    # }
    location /api/vendas {
        default_type application/json;
        return 503 '{"status":503,"erro":"venda-service ainda nao implementado"}';
    }

    # location /api/relatorios {
    #     proxy_pass http://relatorio-service:3006/relatorios;
    #     include /etc/nginx/conf.d/proxy-comum.inc;
    # }
    location /api/relatorios {
        default_type application/json;
        return 503 '{"status":503,"erro":"relatorio-service ainda nao implementado"}';
    }
}
