services:
  postgres-usuario:
    container_name: postgres-usuario
    image: postgres:16
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: usuario_db
    volumes:
      - usuario-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usuario_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  usuario-service:
    container_name: usuario-service
    build: ./usuario-service
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres-usuario:5432/usuario_db
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_SENHA: ${ADMIN_SENHA}
    depends_on:
      postgres-usuario:
        condition: service_healthy
  pagamento-service:
    build:
      context: ./pagamento-service
    container_name: pagamento-service
    ports:
      - "3005:3005"
    volumes:
      - pagamento-data:/app/database
  mysql-produto:
    container_name: mysql-produto
    image: mysql:8.4
    # 3306 no host costuma estar ocupada por um MySQL instalado na maquina,
    # por isso cada banco publica em uma porta propria.
    ports:
      - "${PRODUTO_DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: produto_db
      MYSQL_USER: ${MYSQL_APP_USER:-farmacia}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-farmacia}
    volumes:
      - produto-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
  produto-service:
    container_name: produto-service
    build: ./produto-service
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: "jdbc:mysql://mysql-produto:3306/produto_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DATABASE_USER: ${MYSQL_APP_USER:-farmacia}
      DATABASE_PASSWORD: ${MYSQL_APP_PASSWORD:-farmacia}
    depends_on:
      mysql-produto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8002/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
  mysql-estoque:
    container_name: mysql-estoque
    image: mysql:8.4
    ports:
      - "${ESTOQUE_DB_PORT:-3308}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: estoque_db
      MYSQL_USER: ${MYSQL_APP_USER:-farmacia}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-farmacia}
    volumes:
      - estoque-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
  estoque-service:
    container_name: estoque-service
    build: ./estoque-service
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: "jdbc:mysql://mysql-estoque:3306/estoque_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DATABASE_USER: ${MYSQL_APP_USER:-farmacia}
      DATABASE_PASSWORD: ${MYSQL_APP_PASSWORD:-farmacia}
      PRODUTO_SERVICE_URL: http://produto-service:8002
    depends_on:
      mysql-estoque:
        condition: service_healthy
      produto-service:
        condition: service_healthy
  frontend:
    container_name: frontend
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - usuario-service
      - produto-service
      - estoque-service
      - pagamento-service
volumes:
  usuario-data:
  pagamento-data:
  produto-data:
  estoque-data:
