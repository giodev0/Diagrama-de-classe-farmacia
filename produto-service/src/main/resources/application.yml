server:
  port: ${SERVER_PORT:8002}

spring:
  application:
    name: produto-service
  datasource:
    # allowPublicKeyRetrieval e necessario porque o MySQL 8 usa
    # caching_sha2_password e a conexao local nao vai por SSL.
    url: "${DATABASE_URL:jdbc:mysql://localhost:3307/produto_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: ${DATABASE_USER:farmacia}
    password: ${DATABASE_PASSWORD:farmacia}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    br.edu.unifor.farmacia.produto: INFO

cors:
  # Origens liberadas para o frontend em desenvolvimento.
  # Pelo docker compose o frontend usa o nginx e divide a mesma origem.
  origens-permitidas: ${CORS_ORIGENS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:5500,http://127.0.0.1:5500}
