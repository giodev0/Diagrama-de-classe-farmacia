server:
  port: ${SERVER_PORT:8002}

spring:
  application:
    name: produto-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5435/produto_db}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    br.edu.unifor.farmacia.produto: INFO

cors:
  # Origens liberadas para o frontend em desenvolvimento.
  # Pelo docker compose o frontend usa o nginx e divide a mesma origem.
  origens-permitidas: ${CORS_ORIGENS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:5500,http://127.0.0.1:5500}
